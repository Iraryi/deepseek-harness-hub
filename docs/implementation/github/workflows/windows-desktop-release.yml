name: Windows Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: windows-desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Windows desktop assets
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build and smoke release assets
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows/release/build.ps1

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: deepseek-harness-desktop-${{ github.ref_name }}
          path: windows/release/dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: deepseek-harness-desktop-${{ github.ref_name }}
          path: windows/release/dist

      - name: Validate tag and publish assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = '${{ github.ref_name }}'
          if ($tag -ne "v$version") { throw "Tag $tag does not match package version $version" }
          $assets = Get-ChildItem windows/release/dist -File | ForEach-Object { $_.FullName }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
            gh release edit $tag --title "DeepSeek Harness Desktop $version" --notes-file windows/release/dist/RELEASE_NOTES.md
          }
          else {
            $arguments = @('release', 'create', $tag) + $assets + @('--title', "DeepSeek Harness Desktop $version", '--notes-file', 'windows/release/dist/RELEASE_NOTES.md')
            if ($version.Contains('-')) { $arguments += '--prerelease' }
            gh @arguments
          }
