name: Bug report
description: Report a reproducible HUB, Setup, install, restart, or uninstall problem.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Remove API keys and personal data before attaching logs.
  - type: input
    id: version
    attributes:
      label: HUB/Desktop version
      placeholder: 0.1.0-rc.5
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [HUB UI, Full Setup, Lite Setup, Runtime, Desktop, CONFIG, Update or repair, Uninstall]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Describe the exact clicks and the last visible Setup step.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Drag files here after removing secrets.
